[workspace]
resolver = "2"
members = [
    "crates/locus-core",
    "crates/locus-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/forge18/locus"

[workspace.dependencies]
locus-core = { path = "crates/locus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
toml = "0.8"
agent-client-protocol = "2.0.0"
