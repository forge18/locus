[workspace]
resolver = "2"
members = [
    "crates/locus-core",
    "crates/locus-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/forge18/locus"

[workspace.dependencies]
locus-core = { path = "crates/locus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
toml = "0.8"
bollard = "0.21.1"
sha2 = "0.10"
