[package]
name = "locus-tauri"
version = "0.1.0"
description = "The Locus desktop application."
authors = ["forge18"]
edition = "2021"

[lib]
name = "locus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
locus-core = { path = "../../../crates/locus-core" }
uuid = { workspace = true }

[dev-dependencies]
locus-core = { path = "../../../crates/locus-core", features = ["testkit"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
] }
