<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d2731" />
    <title>Locus</title>
    <!-- Resolves the theme before first paint: the stored choice, else the OS
         preference, else Dark. Must stay in sync with src/styles/theme.ts. -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = window.localStorage.getItem("locus.theme");
        } catch {
          stored = null;
        }
        const prefersDark =
          typeof window.matchMedia !== "function" ||
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          stored === "dark" || (stored !== "light" && prefersDark)
            ? "dark"
            : "light";
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
