name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: 1.57.0

      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Rust tests
        run: just test

      - name: Rust clippy (warnings fail)
        run: just lint

      - name: Desktop build
        run: pnpm -C apps/desktop build

      - name: locusd starts and serves its socket
        run: |
          LOCUS_HARNESS_REGISTRY=harnesses \
            LOCUS_SOCKET_PATH=/tmp/locusd-ci.sock \
            cargo run -p locus-cli --bin locusd &
          for _ in $(seq 1 30); do
            [ -S /tmp/locusd-ci.sock ] && break
            sleep 1
          done
          test -S /tmp/locusd-ci.sock || {
            echo 'locusd never bound its socket' >&2
            exit 1
          }
          kill %1

      - name: Harness registry lint
        run: cargo run -p locus-cli -- harness lint

      - name: Materialization determinism
        run: just test-named locus-core harness::materialize::ci_determinism

      - name: Per-harness canary smoke
        run: |
          just test-named locus-core all_registered_harnesses --ignored
          just test-named locus-core isolates_failure --ignored

      - name: Architecture invariants
        run: |
          bash scripts/check-no-harness-names-in-core.sh
          bash scripts/check-layering.sh
          bash scripts/check-lint-not-in-hooks.sh
          bash scripts/check-no-silent-skips.sh
