name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Rust tests
        run: cargo test

      - name: Rust clippy (warnings fail)
        run: cargo clippy --all-targets -- -D warnings

      - name: Desktop build
        run: pnpm -C apps/desktop build

      - name: Harness registry lint
        run: cargo run -p locus-cli -- harness lint

      - name: Materialization determinism
        run: cargo test -p locus-core materialize::ci_determinism -- --exact

      - name: Per-harness canary smoke
        run: |
          cargo test -p locus-core smoke::all_twelve -- --ignored
          cargo test -p locus-core smoke::isolates_failure -- --ignored

      - name: Docker test markers
        run: bash scripts/check-no-silent-skips.sh
