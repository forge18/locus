[package]
name = "locus-core"
description = "Registry, adapters, supervisors, store, and the shared agent services."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Shared Postgres/canary fixtures. Off by default so `testkit` does not ship in an
# ordinary build; the self dev-dependency below turns it on for this crate's own tests.
testkit = []

[dev-dependencies]
locus-core = { path = ".", features = ["testkit"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
agent-client-protocol.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "derive", "uuid"] }
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
bollard = "0.19"
futures = "0.3"
sha2 = "0.10"
minisign = "0.9.1"
keyring = "3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
