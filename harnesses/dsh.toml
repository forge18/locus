# DeepSeek Harness — hooks arrive through its Claude-Code bridge, so nothing is
# generated. The M0 sandbox spike verified the headless launch and package.
name   = "dsh"
binary = "dsh"
detect = ["--version"]

[image]
base     = "node:22-bookworm-slim"
version  = "0.1.0-rc.7"
install  = ["npm install --global @deepseek-ai/dsh@0.1.0-rc.7"]
verified = true

[launch]
argv = ["--profile", "headless"]
tui  = false

[config]
home_env = "DSH_HOME"               # NOT ~/.deepseek, which is a different TUI
home     = "/locus/config"

[telemetry]
source = "hooks"
# @deepseek-ai/dsh-hooks-claude-code reads a Claude-Code-shaped hook config, so
# locus-hook registers unmodified and the bridge does the translating.
bridge = { plugin = "@deepseek-ai/dsh-hooks-claude-code", config = "/locus/config/locus-hooks.json", registered_in = "/locus/config/cordis.patch.yml" }
format = "claude-hooks-json"
emits  = ["session_start", "user", "tool_call", "tool_result", "tool_error", "session_end"]

[models]
flag      = "--model"                 # UNVERIFIED — dsh is not installed here
list_argv = []

[layout]
agents        = { via = "entries-in", dir = "/locus/config/agents", target = "/locus/config/cordis.patch.yml", key = "plugins", format = "yaml" }
commands      = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; not invocable, so every command costs tokens whether used or not" }
hooks         = { via = "entries-in", dir = "/locus/config/hooks", format = "shell", target = "/locus/config/locus-hooks.json", schema = "claude-code" }
linters       = { via = "dir", dir = "/locus/config/linters", format = "shell+markdown" }
output-styles = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "appended to context; a native style REPLACES the prompt's communication section" }
rules         = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; no path scoping exists" }
skills        = { via = "dir", dir = "/locus/config/skills", format = "markdown+frontmatter" }
context       = { via = "file", file = "/locus/config/AGENTS.md" }

# Agents are not files here: each becomes one @deepseek-ai/dsh-tool-subagent entry
# with a distinct toolName, its persona shadowing the deployment persona.
# Hooks need no plugin — the bridge reads a Claude-Code-shaped config, so the
# hook set is written in that schema and cordis.patch.yml points the bridge at it.
