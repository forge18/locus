# Gemini CLI — first-class. Full hook set with injection, plus ACP.
name   = "gemini"
binary = "gemini"
detect = ["--version"]

[launch]
argv = []
tui  = false

[telemetry]
source = "hooks"
# Every hook payload carries `transcript_path` — an absolute path to the session
# transcript JSON — so capture never has to reconstruct state from event order.
# Payload: session_id, transcript_path, cwd, hook_event_name, timestamp.

[hooks]
config    = "~/.gemini/settings.json"
key       = "hooks"
# Exit 0 -> stdout parsed as JSON. Exit 2 -> blocked, stderr is the reason.
events    = [
  "SessionStart", "SessionEnd",
  "BeforeAgent", "AfterAgent",
  "BeforeTool", "AfterTool",
  "BeforeModel", "AfterModel", "BeforeToolSelection",
  "Notification", "PreCompress",
]
# Injection points, both via hookSpecificOutput.additionalContext:
inject_session = "SessionStart"    # catalog goes here
inject_turn    = "BeforeAgent"     # appended; research task_class only

[models]
flag      = "--model"
list_argv = []

[layout]
# Full native hook set with two injection points, so the catalog lands through
# SessionStart rather than through the context file. Extensions themselves have
# no native directories beyond context — UNVERIFIED against a current release.
agents        = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "no agent directory; nested work goes through `locus agent invoke`" }
commands      = { via = "dir", dir = "/locus/config/commands", format = "markdown+frontmatter" }
hooks         = { via = "entries-in", dir = "/locus/config/hooks", format = "shell", target = "/locus/config/settings.json", key = "hooks" }
linters       = { via = "dir", dir = "/locus/config/linters", format = "shell+markdown" }
output-styles = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "appended to context; a native style REPLACES the prompt's communication section" }
rules         = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; no path scoping exists" }
skills        = { via = "dir", dir = "/locus/config/skills", format = "markdown+frontmatter" }
context       = { via = "file", file = "/locus/config/GEMINI.md" }
