# opencode — the weakest telemetry of the hook-capable set: its hook points are
# tool lifecycle ONLY, so a run produces no session-level events at all.
name   = "opencode"
binary = "opencode"
detect = ["--version"]

[launch]
argv = ["run"]
tui  = false                        # bare `opencode` is a TUI; `run` is not

[config]
home = "/locus/config"              # global config is <XDG>/opencode, NOT ~/.opencode

[telemetry]
source = "acp"

[models]
flag      = "--model"
list_argv = ["models"]

[layout]
agents        = { via = "dir", dir = "/locus/config/agents", format = "markdown+frontmatter" }
commands      = { via = "dir", dir = "/locus/config/command", format = "markdown+frontmatter" }
hooks         = { via = "plugin", emits = "/locus/config/plugin/locus-hooks.ts", weaker_than_native = "tool lifecycle only; session-level events are core-driven from the container boundary" }
linters       = { via = "dir", dir = "/locus/config/linters", format = "shell+markdown" }
output-styles = { via = "listed-in", dir = "/locus/config/output-styles", target = "/locus/config/opencode.json", key = "instructions", active = "brief-bright-gone", weaker_than_native = "listed as an instruction; a native style REPLACES the prompt's communication section" }
rules         = { via = "listed-in", dir = "/locus/config/rules", target = "/locus/config/opencode.json", key = "instructions", weaker_than_native = "everything in instructions loads every turn; path scoping is lost" }
skills        = { via = "dir", dir = "/locus/config/skills", format = "markdown+frontmatter" }
context       = { via = "file", file = "/locus/config/AGENTS.md" }

# `command` is SINGULAR — the one difference here that fails silently: the
# directory exists, the files are there, and nothing loads them.
# Rules cannot be path-scoped: everything in `instructions` loads every turn.
