# Antigravity (agy) — capture via stream-json; hooks are tool-scoped only.
name   = "antigravity"
binary = "agy"
detect = ["--version"]

[launch]
argv = []
tui  = false

[telemetry]
source = "stream-json"
argv   = ["-p", "{prompt}", "--output-format", "stream-json"]
# stdout is the event stream; stderr carries diagnostics, auth prompts, progress.
# The `json` envelope reports usage.{input,output,thinking,cache_read,total}_tokens
# — cache_read_tokens is how injection stability gets measured rather than assumed.

[hooks]
config = ".agents/hooks.json"      # or ~/.gemini/config/hooks.json
events = ["PreToolUse", "PostToolUse", "Stop"]
# Observation and gating only. Stop handlers may set decision="continue"
# to re-enter the loop.

[auth]
# Headless uses cached credentials; an unauthenticated non-TTY run exits with
# `authentication required` rather than hanging. Authenticate once interactively.
pre_auth = "agy"

[layout]
# Reads .agents/ — the directory local-dx treats as human-owned. Hooks exist but
# are tool-scoped, so session-level events come from the stream instead.
agents        = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "no agent directory; nested work goes through `locus agent invoke`" }
commands      = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; not invocable" }
hooks         = { via = "entries-in", dir = "/locus/config/hooks", format = "shell", target = "/locus/config/hooks.json", events = ["PreToolUse", "PostToolUse", "Stop"] }
linters       = { via = "dir", dir = "/locus/config/linters", format = "shell+markdown" }
output-styles = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "appended to context; a native style REPLACES the prompt's communication section" }
rules         = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; no path scoping exists" }
skills        = { via = "dir", dir = "/locus/config/skills", format = "markdown+frontmatter" }
context       = { via = "file", file = "/locus/config/AGENTS.md" }
