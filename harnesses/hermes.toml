# Hermes Agent (Nous Research) — shell hooks are declared in config.yaml.
name   = "hermes"
binary = "hermes"
detect = ["--version"]

[image]
base     = "python:3.12-slim-bookworm"
version  = "0.19.0"
install  = ["pip install 'hermes-agent[acp]'"]
env      = ["HERMES_ACCEPT_HOOKS=1"]
verified = true

[launch]
argv = ["chat", "--cli", "-Q", "-q"]
tui  = false

[telemetry]
source = "hooks"
emits  = ["session_start", "user", "assistant", "tool_call", "tool_result",
           "tool_error", "permission_request", "session_end"]
[hooks]
# Hermes reads shell hooks from config.yaml. Containers must set
# HERMES_ACCEPT_HOOKS=1: otherwise first-use consent makes hooks silently no-op.
config = "/locus/config/config.yaml"
key    = "hooks"

[models]
flag      = "--model"
list_argv = []

[layout]
agents        = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "no agent directory; nested work goes through `locus agent invoke`" }
commands      = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; not invocable" }
hooks         = { via = "entries-in", dir = "/locus/config/hooks", format = "shell", target = "/locus/config/config.yaml", key = "hooks" }
linters       = { via = "dir", dir = "/locus/config/linters", format = "shell+markdown" }
output-styles = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "appended to context; a native style REPLACES the prompt's communication section" }
rules         = { via = "merged-into", target = "context", strip_frontmatter = true, weaker_than_native = "always-on; no path scoping exists" }
skills        = { via = "dir", dir = "/locus/config/skills", format = "markdown+frontmatter" }
context       = { via = "file", file = "/locus/config/AGENTS.md" }


[memory]
# Hermes is the one harness with its own bounded memory: ~/.hermes/memories/
# MEMORY.md (2,200 chars) and USER.md (1,375), injected as a frozen snapshot.
# Locus does NOT write these. Hermes explicitly forbids two processes sharing a
# memory home, and its docs point shared memory at an external provider —
# which is the role Locus occupies. Its core tier stays its own.
native      = "~/.hermes/memories/"
locus_owns  = false
