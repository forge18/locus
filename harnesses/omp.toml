# oh-my-pi — a pi fork. Same shapes, but a SEPARATE file rather than an
# inherited one, because its hook event set can drift at any omp release and a
# shared entry would hide the drift.
name   = "omp"
binary = "omp"
detect = ["--version"]

# omp is a pi fork with the same hooks shape and the same emits path, so it runs pi's
# materializer today. Stated here rather than inherited: when omp's hook event set
# drifts, this line is what changes, and the drift is visible in this file.
materializer = "pi/materialize"

[image]
base     = "debian:bookworm-slim"
version  = "unverified"
install  = []
verified = false

[launch]
argv = ["--print"]
tui  = false

[config]
home = "/locus/config"

[telemetry]
source = "acp"

[models]
flag      = "--model"                 # UNVERIFIED against the installed binary
list_argv = []

[layout]
agents        = { via = "dir", dir = "/locus/config/agents", format = "markdown+frontmatter" }
commands      = { via = "dir", dir = "/locus/config/prompts", format = "markdown+frontmatter" }
hooks         = { via = "plugin", emits = "/locus/config/extensions/locus-hooks.ts" }
linters       = { via = "dir", dir = "/locus/config/linters", format = "shell+markdown" }
output-styles = { via = "dir", dir = "/locus/config/output-styles", format = "markdown+frontmatter", active = "brief-bright-gone" }
rules         = { via = "dir", dir = "/locus/config/rules", format = "markdown+frontmatter" }
skills        = { via = "dir", dir = "/locus/config/skills", format = "markdown+frontmatter" }
context       = { via = "file", file = "/locus/config/AGENTS.md" }

# Rules are native here, unlike pi. Same startup rename trap on prompts.
